name: Japanese plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  japanese:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run sync:contracts
      - run: git diff --exit-code -- tests/fixtures/upstream-dictionaries.json
      - run: npm run build
      - run: git diff --exit-code --stat -- dist
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run pack:plugin
